services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN to the public HTTPS URL of the frontend}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL for the first administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD}
      USER_EMAIL: ${USER_EMAIL:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
      NOTHI_ADMIN_USER_IDS: ${NOTHI_ADMIN_USER_IDS:-}
      REDIS_URL: ${REDIS_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_LEGAL_COLLECTION: ${QDRANT_LEGAL_COLLECTION:-nothi-legal}
      NOTHI_ASK_PER_MINUTE: ${NOTHI_ASK_PER_MINUTE:-5}
      NOTHI_ASK_PER_DAY: ${NOTHI_ASK_PER_DAY:-10}
      NOTHI_ASK_MAX_OUTPUT_TOKENS: ${NOTHI_ASK_MAX_OUTPUT_TOKENS:-500}
      NOTHI_ASK_DAILY_TOKEN_BUDGET: ${NOTHI_ASK_DAILY_TOKEN_BUDGET:-50000}
    expose:
      - "3001"
    volumes:
      - backend-data:/app/backend/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://backend:3001
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  backend-data:
